<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styletest.css">
    <title>TEST Weekend</title>
</head>
<body>

    <header>
        <div class="logo">
        <h1>LOGO</h1>
        </div>
        <div class="menuicon"><img src="assets/menu.png" alt="menu"></div>
       
    </header>

    <section>
        <div class="herocontent">
        <div class="flexbox">
            <div class="flexchild1">
                <div class="icon"><img src="assets/lightbulb.png" alt=""></div>
                <h4>OUR Main Office</h4>
                <p>SoHo 94 Broadway St New York, NY 1001</p>
            </div>
             <div class="flexchild1">
                <div class="icon"><img src="assets/lightbulb.png" alt=""></div>
                <h4>Phone number</h4>
                <p>234-9876-5400 888-0123-4567 (Toll Free)</p>
            </div>
             <div class="flexchild1">
                <div class="icon"><img src="assets/lightbulb.png" alt=""></div>
                <h4>Email</h4>
                <p>hello@sasadf.com</p>
            </div>
             <div class="flexchild1">
                <div class="icon"><img src="assets/lightbulb.png" alt=""></div>
                <h4>Fax</h4>
                <p>1-234-567-8900</p>
            </div>
        </div>
   
        <div class="contactform">
        <h1>CONTACT US</h1>
        <div class="cformdv">
        <form action="" name="cform" id="cform">
            <input type="text" name="cname" id="cname" placeholder="Enter your Name">
            <input type="text" name="cmail" id="cmail" placeholder="Enter your valid Email Address">
            <textarea name="ctext" id="ctext"></textarea>
            <button type="submit">Submit</button>
        </form>
        </div>
        </div>
        </div>
    </section>

    
    
</body>
</html>
