    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="mycss.css">
        <title>Test Weekoff</title>
    </head>
    <body>
        <section>
            <div class="mycontainer">
            <div class="mycformleft">
                <img src="assets/images2.png" alt="">
            </div>
            <div class="mycformright">
                <p class="info">Get In Touch</p>
                <form action="" class="myform" id="myform">
                    <input type="text" name="cname" id="cname" placeholder="Name" >
                    <div id="nameErr"></div>
                    <input type="email" name="cemail" id="cemail" placeholder="Email" >
                    <div id="emailErr"></div>
                    <textarea name="msg" id="msg" placeholder="Message.." ></textarea>
                    <div id="msgErr"></div>
                    <button type="submit">Send</button>
                </form>
            </div>
            </div>
        </section>
        
        <script>

    const myform = document.getElementById("myform");

    myform.addEventListener("submit", function(event) {

        event.preventDefault();

        const cname = document.getElementById("cname").value.trim();
        const cemail = document.getElementById("cemail").value.trim();
        const msg = document.getElementById("msg").value.trim();

        const nameErr = document.getElementById("nameErr");
        const emailErr = document.getElementById("emailErr");
        const msgErr = document.getElementById("msgErr");

        let isvalid = true;
        nameErr.textContent = "";
        emailErr.textContent = "";
        msgErr.textContent = "";

        if (cname === "") {
            nameErr.textContent = "Name is required";
            isvalid = false;
        }

        
        const emailPattern = /[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]/
        if (!cemail) {
            emailErr.textContent = "Please Fill the email Data"
            isValid = false
        }
        else if (!emailPattern.test(cemail)) {
            emailErr.textContent = "Please Fill the correct email Data"
            isValid = false
        }
        else {
            emailErr.textContent = ""
            isValid = true
        }


        if (msg === "") {
            msgErr.textContent = "Message is required";
            isvalid = false;
        }

        if (isvalid) {
            alert("Form submitted successfully!");
            myform.reset();
        }

    });

    </script>
